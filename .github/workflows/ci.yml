name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint and format
        run: npx biome ci .

      - name: Typecheck
        run: npm run typecheck

      - name: Template guard
        run: npm run check:template

      - name: Validate manifests and skills
        run: npm run validate

      - name: OAuth discovery
        run: npm run verify:discovery
